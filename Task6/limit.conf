http {
    limit_req_zone $binary_remote_addr zone=req_limit_zone:10m rate=10r/m;

    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            limit_req zone=req_limit_zone burst=0 nodelay;

            error_page 429 = /custom_429;

            proxy_pass http://backend_servers;
        }

        location = /custom_429 {
            return 429 "Первышен лимит запросов";
        }
    }
}